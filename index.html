:root{--bg:#f6f1e8;--paper:#fffdf8;--ink:#1f2933;--muted:#667085;--line:#ded5c7;--accent:#0f766e;--accent-soft:#e0f2ef;--accent-dark:#0b5f59;--mark:#a16207;--gold:#b77900}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.55} header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);padding:14px 22px} .head-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap} h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:0} .hint{margin:0;color:var(--muted);font-size:14px} main{max-width:1180px;margin:0 auto;padding:20px 22px 40px} .day-title{margin:22px 0 10px;padding:9px 12px;background:#2f4858;color:#fff;font-size:20px;border-radius:4px;letter-spacing:0} .group-title{margin:14px 0 6px;padding:6px 10px;background:#e8ded0;border-left:5px solid var(--accent);color:#25313d;font-size:17px;border-radius:3px;letter-spacing:0} .word-list{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden} .entry{display:grid;grid-template-columns:38px 54px minmax(130px,220px) minmax(118px,150px) minmax(0,1fr);gap:10px 14px;align-items:start;padding:9px 12px;border-top:1px solid #eee7dc} .entry:first-child{border-top:0} .entry.active{background:var(--accent-soft)} .fav{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:#a8a29e;cursor:pointer;font-size:18px;line-height:1;padding:0} .fav.active{background:#fff7d6;color:var(--gold);border-color:#d9a700} .fav:hover{border-color:var(--gold)} .num{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:right;padding-top:3px} .word{border:0;background:transparent;color:var(--accent-dark);cursor:pointer;padding:0;text-align:left;font-size:20px;font-weight:800;letter-spacing:0;overflow-wrap:anywhere} .word:hover,.word:focus{color:#fff;background:var(--accent);outline:0;box-shadow:0 0 0 4px var(--accent);border-radius:2px} .ipa{color:var(--mark);font-family:"Segoe UI",Arial,sans-serif;font-size:1 html,body{overscroll-behavior:none} body.touch-writing #writingCanvas{pointer-events:auto;touch-action:none}
@media(max-width:760px){header{position:static;padding:13px 14px} h1{font-size:22px} .hint{display:none} main{padding:14px 12px 88px} .entry{grid-template-columns:34px 38px minmax(0,1fr);gap:4px 10px;padding:9px 10px} .word{font-size:19px} .ipa,.meaning{grid-column:3/-1} .num{text-align:left} .meaning{font-size:14px} #playerBar{left:12px;right:12px;bottom:12px;width:auto}}
</style>

const favoriteKey='cet6-word-reader-favorites-v1';const favorites=new Set(JSON.parse(localStorage.getItem(favoriteKey)||'[]'));let showFavorites=false;function saveFavorites(){localStorage.setItem(favoriteKey,JSON.stringify([...favorites]));focusCount.textContent=favorites.size}function heading(text,cls){const h=document.createElement('h2');h.className=cls;h.textContent=text;content.appendChild(h)} function groupList(items){const list=document.createElement('section');list.className='word-list';items.forEach(item=>{const entry=document.createElement('div');entry.className='entry';const fav=document.createElement('button');fav.type='button';fav.className='fav'+(favorites.has(item.index)?' active':'');fav.textContent=favorites.has(item.index)?'\u2605':'\u2606';fav.title=favorites.has(item.index)?'\u79fb\u51fa\u91cd\u70b9\u8bcd\u6c47\u672c':'\u52a0\u5165\u91cd\u70b9\u8bcd\u6c47\u672c';fav.addEventListener('click',e=>{e.stopPropagation();if(favorites.has(item.index))favorites.delete(item.index);else favorites.add(item.index);saveFavorites();if(showFavorites)renderWords();else{fav.classList.toggle('active',favorites.has(item.index));fav.textContent=favorites.has(item.index)?'\u2605':'\u2606';fav.title=favorites.has(item.index)?'\u79fb\u51fa\u91cd\u70b9\u8bcd\u6c47\u672c':'\u52a0\u5165\u91cd\u70b9\u8bcd\u6c47\u672c'}});const num=document.createElement('div');num.className='num';num.textContent=item.index;const word=document.createElement('button');word.type='button';word.className='word';word.textContent=item.word;word.title=item.speak;word.addEventListener('click',()=>speak(item,entry));const ipa=document.createElement('div');ipa.className='ipa';ipa.textContent=item.ipa;const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=item.meaning;entry.append(fav,num,word,ipa,meaning);list.appendChild(entry)});content.appendChild(list)} function renderWords(){content.textContent='';const source=showFavorites?words.filter(item=>favorites.has(item.index)):words;if(!source.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='\u8fd8\u6ca1\u6709\u91cd\u70b9\u8bcd\uff0c\u70b9\u5355\u8bcd\u5de6\u4fa7\u7684\u661f\u6807\u52a0\u5165\u3002';content.appendChild(empty);return}let d=null,g=null,b=[];function flush(){if(b.length)groupList(b);b=[]}source.forEach(item=>{if(item.day!==d){flush();d=item.day;g=null;heading('Day '+item.day,'day-title')}if(item.group!==g){flush();g=item.group;heading('Group '+item.group,'group-title')}b.push(item)});flush()}focusOnly.addEventListener('click',()=>{showFavorites=!showFavorites;focusOnly.classList.toggle('active',showFavorites);focusOnly.firstChild.nodeValue=showFavorites?'\u5168\u90e8\u8bcd\u6c47 ':'\u91cd\u70b9\u8bcd\u6c47\u672c ';renderWords()});saveFavorites();renderWords();
function fitCanvas(){const r=window.devicePixelRatio||1;canvas.width=Math.ceil(innerWidth*r);canvas.height=Math.ceil(innerHeight*r);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(r,0,0,r,0,0);ctx.lineCap='round';ctx.lineJoin='round'}
function clearInkNow(){ctx.clearRect(0,0,innerWidth,innerHeight)} function shouldWrite(e){if(e.target.closest('#playerBar,.write-tools'))return false;return e.pointerType==='pen'||touchWrite.checked} function blockWriteScroll(e){if(e.cancelable&&(activeStroke||(touchWrite.checked&&!e.target.closest('#playerBar,.write-tools'))))e.preventDefault()} function widthFrom(e,last){const pressure=e.pressure&&e.pressure>.02?e.pressure:.5;if(!last)return 5.2;const dt=Math.max(6,performance.now()-last.t),speed=Math.hypot(e.clientX-last.x,e.clientY-last.y)/dt;return Math.max(2.1,Math.min(8.6,5.4+pressure*4-speed*10))} function drawTo(e){if(!activeStroke)return;const x=e.clientX,y=e.clientY,last=activeStroke.last;const dist=Math.hypot(x-last.x,y-last.y);if(dist<.3)return;const w=widthFrom(e,last);ctx.strokeStyle=activeStroke.color;ctx.lineWidth=(last.w+w)/2;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();activeStroke.last={x,y,w,t:performance.now()};if(dist>2)suppressClickUntil=Date.now()+260} function down(e){if(!shouldWrite(e))return;clearTimeout(clearTimer);const w=widthFrom(e,null);activeStroke={pointerId:e.pointerId,color:inkColor,last:{x:e.clientX,y:e.clientY,w,t:performance.now()}};ctx.fillStyle=inkColor;ctx.beginPath();ctx.arc(e.clientX,e.clientY,w/2,0,Math.PI*2);ctx.fill();e.preventDefault()} function move(e){if(!activeStroke||activeStroke.pointerId!==e.pointerId)return;const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)drawTo(ev);e.preventDefault()} function up(e){if(!activeStroke||activeStroke.pointerId!==e.pointerId)return;drawTo(e);activeStroke=null;e.preventDefault()} addEventListener('resize',fitCanvas);document.addEventListener('pointerdown',down,{capture:true,passive:false});document.addEventListener('pointermove',move,{capture:true,passive:false});document.addEventListener('pointerup',up,{capture:true,passive:false});document.addEventListener('pointercancel',up,{capture:true,passive:false});document.addEventListener('touchstart',blockWriteScroll,{capture:true,passive:false});document.addEventListener('touchmove',blockWriteScroll,{capture:true,passive:false});document.addEventListener('wheel',blockWriteScroll,{capture:true,passive:false});document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil&&e.target.closest('.word')){e.preventDefault();e.stopImmediatePropagation()}},true);function setInkColor(color){inkColor=color;customInk.value=color;colorButtons.forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===color.toLowerCase()))} colorButtons.forEach(button=>button.addEventListener('click',()=>setInkColor(button.dataset.color)));customInk.addEventListener('input',e=>{inkColor=e.target.value;colorButtons.forEach(b=>b.classList.remove('active'))});function setTouchWriting(on){document.body.classList.toggle('touch-writing',on);canvas.style.pointerEvents=on?'auto':'none'} touchWrite.addEventListener('change',()=>setTouchWriting(touchWrite.checked));clearInk.addEventListener('click',()=>{clearTimeout(clearTimer);activeStroke=null;clearInkNow()});setTouchWriting(touchWrite.checked);fitCanvas();
