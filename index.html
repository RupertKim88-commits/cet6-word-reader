const words=JSON.parse(document.getElementById('wordData').textContent);const content=document.getElementById('content');const status=document.getElementById('status');const audioPlayer=document.getElementById('audioPlayer');let selectedVoice=null;const canvas=document.getElementById('writingCanvas');const ctx=canvas.getContext('2d');const touchWrite=document.getElementById('touchWrite');const clearInk=document.getElementById('clearInk');const colorButtons=[...document.querySelectorAll('.ink-color')];const customInk=document.getElementById('customInk');let inkColor='#123b36';const strokes=[];const inkDelay=2800;const fadeTime=1200;let activeStroke=null;let frame=0;let suppressClickUntil=0;
function pickVoice(){if(!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices();selectedVoice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'))||null} if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speechFallback(item){if(!('speechSynthesis'in window))return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(item.speak);u.lang='en-US';u.rate=.9;u.pitch=1;u.volume=1;if(selectedVoice)u.voice=selectedVoice;u.onstart=()=>status.textContent='正在读：'+item.word;u.onend=()=>status.textContent='已播放：'+item.word;u.onerror=()=>status.textContent='如果没听到声音，请点底部播放条的播放按钮';speechSynthesis.speak(u);return true}
async function speak(item,entry){document.querySelectorAll('.entry.active').forEach(n=>n.classList.remove('active'));entry.classList.add('active');if('speechSynthesis'in window)speechSynthesis.cancel();audioPlayer.pause();audioPlayer.currentTime=0;audioPlayer.src=item.audio;status.textContent='正在读：'+item.word;audioPlayer.onended=()=>status.textContent='已播放：'+item.word;audioPlayer.onerror=()=>{if(!speechFallback(item))status.textContent='如果没听到声音，请点底部播放条的播放按钮'};try{await audioPlayer.play()}catch(e){if(!speechFallback(item))status.textContent='如果没听到声音，请点底部播放条的播放按钮'}}
function heading(text,cls){const h=document.createElement('h2');h.className=cls;h.textContent=text;content.appendChild(h)} function groupList(items){const list=document.createElement('section');list.className='word-list';items.forEach(item=>{const entry=document.createElement('div');entry.className='entry';const num=document.createElement('div');num.className='num';num.textContent=item.index;const word=document.createElement('button');word.type='button';word.className='word';word.textContent=item.word;word.title=item.speak;word.addEventListener('click',()=>speak(item,entry));const ipa=document.createElement('div');ipa.className='ipa';ipa.textContent=item.ipa;entry.append(num,word,ipa);list.appendChild(entry)});content.appendChild(list)} let d=null,g=null,b=[];function flush(){if(b.length)groupList(b);b=[]} words.forEach(item=>{if(item.day!==d){flush();d=item.day;g=null;heading('Day '+item.day,'day-title')} if(item.group!==g){flush();g=item.group;heading('Group '+item.group,'group-title')} b.push(item)});flush();
function resize(){const r=window.devicePixelRatio||1;canvas.width=Math.ceil(innerWidth*r);canvas.height=Math.ceil(innerHeight*r);ctx.setTransform(r,0,0,r,0,0);draw()} function req(){if(!frame)frame=requestAnimationFrame(draw)} function easeWidth(a,b){return a+(b-a)*.55} function pointFrom(e,last){const t=performance.now();const pressure=e.pressure&&e.pressure>.02?e.pressure:.5;if(!last)return{x:e.clientX,y:e.clientY,pressure,width:5.8,t};const dx=e.clientX-last.x,dy=e.clientY-last.y,dt=Math.max(6,t-last.t),speed=Math.hypot(dx,dy)/dt;const target=Math.max(2.2,Math.min(9.5,7.4+(pressure*4.2)-(speed*13)));return{x:e.clientX,y:e.clientY,pressure,width:easeWidth(last.width||target,target),t}} function drawSegment(a,b,alpha,color){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ctx.save();ctx.globalAlpha=alpha*.18;ctx.strokeStyle=color;ctx.lineWidth=((a.width+b.width)/2)+2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=color;ctx.shadowBlur=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(a.x,a.y,mx,my);ctx.stroke();ctx.restore();ctx.save();ctx.globalAlpha=alpha*.96;ctx.strokeStyle=color;ctx.lineWidth=(a.width+b.width)/2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(a.x,a.y,mx,my);ctx.stroke();ctx.restore()} function draw(now=performance.now()){frame=0;ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=strokes.length-1;i>=0;i--){const s=strokes[i];const fade=s.expiresAt||Infinity;const op=now<=fade?1:Math.max(0,1-(now-fade)/fadeTime);if(op<=0){strokes.splice(i,1);continue} if(s.points.length===1){const p=s.points[0];ctx.save();ctx.globalAlpha=op*.96;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p.x,p.y,(p.width||5)/2,0,Math.PI*2);ctx.fill();ctx.restore();continue} for(let j=1;j<s.points.length;j++)drawSegment(s.points[j-1],s.points[j],op,s.color)} if(strokes.length)req()} function shouldWrite(e){if(e.target.closest('#playerBar,.write-tools'))return false;return e.pointerType==='pen'||touchWrite.checked} function addInkPoint(e){const last=activeStroke.points[activeStroke.points.length-1];const p=pointFrom(e,last);const dist=last?Math.hypot(p.x-last.x,p.y-last.y):99;if(dist<.35)return;activeStroke.points.push(p);if(dist>2||activeStroke.points.length>3)suppressClickUntil=Date.now()+350} function down(e){if(!shouldWrite(e))return;activeStroke={pointerId:e.pointerId,color:inkColor,points:[pointFrom(e,null)],expiresAt:0};strokes.push(activeStroke);try{e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId)}catch(_){} draw();e.preventDefault()} function move(e){if(!activeStroke||activeStroke.pointerId!==e.pointerId)return;const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of events)addInkPoint(ev);e.preventDefault();draw()} function up(e){if(!activeStroke||activeStroke.pointerId!==e.pointerId)return;if(activeStroke.points.length===1){const p=activeStroke.points[0];activeStroke.points.push({x:p.x+.3,y:p.y+.3,pressure:p.pressure,width:p.width*.65,t:p.t+10})}else{const p=activeStroke.points[activeStroke.points.length-1];activeStroke.points.push({x:p.x+.08,y:p.y+.08,pressure:p.pressure,width:Math.max(1.6,p.width*.58),t:p.t+12})} activeStroke.expiresAt=performance.now()+inkDelay;activeStroke=null;draw();e.preventDefault()} addEventListener('resize',resize);document.addEventListener('pointerdown',down,{capture:true,passive:false});document.addEventListener('pointermove',move,{capture:true,passive:false});document.addEventListener('pointerup',up,{capture:true,passive:false});document.addEventListener('pointercancel',up,{capture:true,passive:false});document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil&&e.target.closest('.word')){e.preventDefault();e.stopImmediatePropagation()}},true);function setInkColor(color){inkColor=color;customInk.value=color;colorButtons.forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===color.toLowerCase()))} colorButtons.forEach(button=>button.addEventListener('click',()=>setInkColor(button.dataset.color)));customInk.addEventListener('input',e=>{inkColor=e.target.value;colorButtons.forEach(b=>b.classList.remove('active'))});touchWrite.addEventListener('change',()=>document.body.classList.toggle('touch-writing',touchWrite.checked));clearInk.addEventListener('click',()=>{strokes.length=0;activeStroke=null;draw()});resize();
